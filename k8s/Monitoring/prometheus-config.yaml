apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: chronos
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'chronos-prod'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      # API Service
      - job_name: 'api-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-service:8080']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}'

      # Scheduler Service
      - job_name: 'scheduler-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['scheduler-service:8081']

      # Worker Service
      - job_name: 'worker-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['worker-service:8082']

      # PostgreSQL
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']

      # Redis
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']

      # RabbitMQ
      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']

  alert-rules.yml: |
    groups:
      - name: chronos_alerts
        interval: 30s
        rules:
          # High error rate
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "{{ $labels.service }} has error rate of {{ $value }} errors/sec"

          # Job failures
          - alert: JobFailureSpike
            expr: rate(job_executions_total{status="FAILED"}[10m]) > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Spike in job failures"
              description: "More than 5 job failures per minute"

          # Service down
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "{{ $labels.job }} has been down for more than 2 minutes"

          # High memory usage
          - alert: HighMemoryUsage
            expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "{{ $labels.pod }} memory usage is above 90%"

          # Database connection pool exhausted
          - alert: DatabaseConnectionPoolExhausted
            expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "Database connection pool nearly exhausted"
              description: "Connection pool is at {{ $value | humanizePercentage }} capacity"

          # RabbitMQ queue buildup
          - alert: RabbitMQQueueBuildup
            expr: rabbitmq_queue_messages > 1000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "RabbitMQ queue buildup"
              description: "Queue {{ $labels.queue }} has {{ $value }} messages"

          # Slow job execution
          - alert: SlowJobExecution
            expr: histogram_quantile(0.95, rate(job_execution_duration_seconds_bucket[5m])) > 30
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Jobs are executing slowly"
              description: "95th percentile execution time is {{ $value }}s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chronos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chronos
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: chronos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: chronos