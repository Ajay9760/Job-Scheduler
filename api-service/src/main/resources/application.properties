spring.application.name=api-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chronos}
spring.datasource.username=${DB_USERNAME:chronos}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# No default: the app refuses to start without a >=32 char secret.
chronos.jwt.secret=${JWT_SECRET}
chronos.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
chronos.auth.registration-enabled=${REGISTRATION_ENABLED:true}
chronos.admin.username=${ADMIN_USERNAME:}
chronos.admin.password=${ADMIN_PASSWORD:}
chronos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
chronos.security.allow-private-targets=${ALLOW_PRIVATE_TARGETS:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
