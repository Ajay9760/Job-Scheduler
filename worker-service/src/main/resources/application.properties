spring.application.name=worker-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chronos}
spring.datasource.username=${DB_USERNAME:chronos}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USERNAME:chronos}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.listener.simple.concurrency=${WORKER_CONCURRENCY:4}
spring.rabbitmq.listener.simple.max-concurrency=${WORKER_MAX_CONCURRENCY:8}
spring.rabbitmq.listener.simple.prefetch=${WORKER_PREFETCH:10}
# poison messages go to the DLQ instead of looping
spring.rabbitmq.listener.simple.default-requeue-rejected=false

chronos.security.allow-private-targets=${ALLOW_PRIVATE_TARGETS:false}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
