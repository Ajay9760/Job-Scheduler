# -------------------------
# Server Configuration
# -------------------------
server.port=${SERVER_PORT:8080}
spring.application.name=scheduler-service

# -------------------------
# Database Configuration
# -------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------
# Flyway
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -------------------------
# RabbitMQ
# -------------------------
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# -------------------------
# Redis
# -------------------------
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# -------------------------
# Scheduler
# -------------------------
scheduler.fixed-rate=5000
scheduler.lock-key=chronos:scheduler:lock
scheduler.lock-expiry=10000

# -------------------------
# Queue
# -------------------------
queue.name=chronos-jobs-queue

# -------------------------
# Actuator
# -------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
